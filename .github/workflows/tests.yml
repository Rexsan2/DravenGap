name: Tests

# Runs the full desktop-app test suite (unit + renderer) on every push and on every pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # DravenGap is a Windows app and the renderer tests open hidden Electron windows, so run on Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
